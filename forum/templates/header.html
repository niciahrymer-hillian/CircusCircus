<div style="display: flex; align-items: center; gap: 20px; justify-content: space-between;">
	<div style="display: flex; align-items: center; gap: 15px;">
		<img src="{{ url_for('static', filename='logo.svg') }}" alt="Logo" style="height: 64px; width: 64px; border-radius: 14px; background: linear-gradient(135deg, #ffffff 0%, #eaf2ff 100%); padding: 6px; box-shadow: 0 6px 14px rgba(0, 35, 90, 0.25);">
		<div>
			<a href="/" style="color: white; text-decoration: none; font-size: 24px; font-weight: bold;">{{ config.SITE_NAME }}</a>
			{% if config.SITE_DESCRIPTION %}<br><span style="color: rgba(255, 255, 255, 0.9); font-size: 12px;">{{ config.SITE_DESCRIPTION }}</span>{% endif %}
		</div>
	</div>
	<div class="login" style="display: flex; align-items: center; gap: 15px;">
		{% if current_user.is_authenticated %}
		<span style="color: white;">Welcome, <b style="{% if current_user.admin %}color: #ffd700;{% else %}color: white;{% endif %}">{{ current_user.username }}</b></span>
		<a class="logoutlink" href="/inbox" style="padding: 6px 12px; background-color: rgba(255, 255, 255, 0.2); border-radius: 4px; color: white; text-decoration: none;">Messages</a>
		<a class="logoutlink" href="/settings" style="padding: 6px 12px; background-color: rgba(255, 255, 255, 0.2); border-radius: 4px; color: white; text-decoration: none;">Settings</a>
		<a class="logoutlink" href="/action_logout" style="padding: 6px 12px; background-color: rgba(255, 255, 255, 0.2); border-radius: 4px; color: white; text-decoration: none;">Logout</a>
		{% else %}
		<a href="/loginform" style="padding: 8px 16px; background-color: rgba(255, 255, 255, 0.25); color: white; text-decoration: none; border-radius: 4px; display: inline-block;">Login / Register</a>
		{% endif %}
	</div>
</div>
